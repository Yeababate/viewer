<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cars Viewer - Home</title>
        <meta name="description" content="Display cars data">
        <link rel="stylesheet" href="static/style.css">
</head>

<body>
        <div class="top-bar">
        <header>
                <h1>Find A Car</h1>
        </header>

        <nav class="heading">
                <ol>
                        <li class="heading"><a href="#">Home</a></li>
                        <li class="heading"><a href="#">Model Details</a></li>
                        <li class="heading"><a href="#">Compare Cars</a></li>
                </ol>
        </nav>
        </div>

        <main>
                <section class="headline">
                    <h2 class="h2">Find Your Next Car</h2>
                    <p class="subheading">A tagline of some kind</p>
                </section>
                       
                <section> 
                     <!-- search and filter functionality-->
                </section>

                <section class="car-display">
                    <div class="border">
                        <h3>Display</h3>
                        <div class="car-container">

			{{ range . }}
                        <a href="/car/{{ .Id }}">
                            <div class="car-border">
                            
                                <div class="image-box">
				        <img src="/static/img/{{ .Image }}" alt="{{ .ModelName }}">
                                </div>
                                <div class="text-box">
					<span>Car</span>
					<span>{{ .ModelName }}</span>
					<BR>
					<span>{{ .ManuYear }}</span>

                                </div>
                            
                            </div>
                        </a>       
			{{ end }}
                        </div>
                    </div>
                </section>


        </main>

        <footer>
        </footer>


</body>
</html>
